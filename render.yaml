# Render Blueprint: one web service that serves both the REST API and the built React app.
# Data stays in MongoDB Atlas (MONGODB_URI is entered in the Render dashboard, never committed).
services:
  - type: web
    name: i-itsm
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false # paste your Atlas connection string when Render asks
      - key: JWT_SECRET
        generateValue: true
      - key: SLA_MONITOR_INTERVAL_MS
        value: "30000"
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1" # test-only dependency: skip downloading a MongoDB binary during build
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
# Optional, added later in the service's Environment tab for real e-mails:
#   SMTP_USER, SMTP_PASS (Gmail app password), EMAIL_FROM, EMAIL_OVERRIDE_RECIPIENT
